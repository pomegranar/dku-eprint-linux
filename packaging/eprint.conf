# DKU ePrint configuration
# Jobs are held at the server and released with your DKUCard at any ePrint
# station.

server = dku-ep-ps2-pap1.oit.duke.edu

# Your DKU NetID. Leave blank to be asked in a dialog for each job.
netid =

# never  = always use the netid above
# always = ask in a desktop dialog for every job, via dku-eprint-agent
prompt = always
